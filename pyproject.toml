[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicheck"
version = "0.1.0"
description = "Multi-Signal-Triage, ob ein Bild KI-generiert ist (lokal, CPU)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.12",
    "transformers>=5.12",
    "pillow>=11",
    "numpy>=2.0",
    "requests>=2.31",
]

[project.scripts]
# Erzeugt einen plattformneutralen `aicheck`-Befehl (macOS/Linux/Windows/WSL).
aicheck = "aicheck.cli:main"

[tool.setuptools.packages.find]
include = ["aicheck*"]
